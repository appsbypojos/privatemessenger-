name: Repair LayoutParams

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix ScrollView LayoutParams
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/privatemessenger/app/MainActivity.kt')
          s = p.read_text()
          old = 'ScrollView.LayoutParams(-1, -2)'
          new = 'android.widget.FrameLayout.LayoutParams(-1, -2)'
          if old in s:
              p.write_text(s.replace(old, new))
          PY

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/privatemessenger/app/MainActivity.kt
          git commit -m "fix: use valid FrameLayout params for chat messages"
          git push
